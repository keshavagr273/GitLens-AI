version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gitlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - gitlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gitlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gitlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gitlens_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gitlens_pgdata:
  gitlens_redisdata:
